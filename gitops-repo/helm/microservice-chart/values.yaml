replicaCount: 2

service:
  type: ClusterIP
  port: 80

container:
  port: 8080

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  host: ecommerce.example.com

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10