apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: notification-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/avkhaladkar1991/gitops-repo.git
    targetRevision: main
    path: helm/notification-service

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true